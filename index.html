<title>Building a Claude Second Brain</title>
<meta name="description" content="A setup guide for replicating a Claude Code + Obsidian second-brain workflow">

<style>
  :root {
    --paper: #f2efe7;
    --surface: #fffefb;
    --ink: #1e1b16;
    --ink-dim: #6b655a;
    --ink-faint: #9c968a;
    --rule: #d8d3c4;
    --signal: #2f6f62;
    --signal-soft: #dbe8e4;
    --danger: #9a3b2a;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --mono: "SF Mono", "Menlo", "Consolas", "Liberation Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #14181a;
      --surface: #1c2224;
      --ink: #e7e4dc;
      --ink-dim: #9aa39f;
      --ink-faint: #6c7573;
      --rule: #2a3134;
      --signal: #5fbfab;
      --signal-soft: #1c3733;
      --danger: #e0806c;
    }
  }
  :root[data-theme="dark"] {
    --paper: #14181a;
    --surface: #1c2224;
    --ink: #e7e4dc;
    --ink-dim: #9aa39f;
    --ink-faint: #6c7573;
    --rule: #2a3134;
    --signal: #5fbfab;
    --signal-soft: #1c3733;
    --danger: #e0806c;
  }

  body { background: var(--paper); color: var(--ink); }

  .gate {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    background: var(--paper);
  }
  .gate-card {
    width: 100%;
    max-width: 384px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 36px 32px 30px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .gate-mark {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--signal-soft);
    border: 1px solid var(--signal);
    display: flex; align-items: center; justify-content: center;
    color: var(--signal);
  }
  .gate-mark svg { width: 17px; height: 17px; display: block; }
  .gate-eyebrow {
    font-family: var(--sans);
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0;
  }
  .gate-card h1 {
    font-family: var(--serif);
    font-size: 25px;
    line-height: 1.22;
    font-weight: 600;
    margin: 0;
    text-wrap: balance;
  }
  .gate-note {
    font-family: var(--sans);
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--ink-dim);
    margin: 0;
  }
  .gate-form { display: flex; flex-direction: column; gap: 10px; }
  .gate-form label {
    font-family: var(--sans);
    font-size: 11px;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .gate-row { display: flex; gap: 8px; }
  #pass {
    flex: 1;
    min-width: 0;
    font-family: var(--mono);
    font-size: 15px;
    letter-spacing: .06em;
    padding: 10px 12px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 6px;
  }
  #pass:focus-visible, #go:focus-visible {
    outline: 2px solid var(--signal);
    outline-offset: 2px;
  }
  #go {
    font-family: var(--sans);
    font-size: 13.5px;
    font-weight: 600;
    padding: 10px 18px;
    color: var(--paper);
    background: var(--signal);
    border: 1px solid var(--signal);
    border-radius: 6px;
    cursor: pointer;
  }
  #go[disabled] { opacity: .55; cursor: default; }
  .gate-msg {
    font-family: var(--sans);
    font-size: 12.5px;
    line-height: 1.5;
    min-height: 1.5em;
    margin: 0;
    color: var(--ink-faint);
  }
  .gate-msg.is-error { color: var(--danger); }
  #doc { animation: rise .32s ease-out; }
  @media (prefers-reduced-motion: reduce) {
    #doc { animation: none; }
  }
  @keyframes rise { from { opacity: 0; } to { opacity: 1; } }
</style>

<div class="gate" id="gate">
  <div class="gate-card">
    <div class="gate-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        <rect x="5" y="11" width="14" height="10" rx="2"/>
      </svg>
    </div>
    <p class="gate-eyebrow">Passcode required</p>
    <h1>Building a Claude Second Brain</h1>
    <p class="gate-note">This guide is passcode-protected. Enter the passcode you were sent to read it.</p>
    <form class="gate-form" id="form">
      <label for="pass">Passcode</label>
      <div class="gate-row">
        <input id="pass" name="pass" type="password" autocomplete="off" autocapitalize="off"
               spellcheck="false" aria-describedby="msg">
        <button id="go" type="submit">Open</button>
      </div>
      <p class="gate-msg" id="msg" role="status"></p>
    </form>
  </div>
</div>

<script>
(function () {
  var KEY = "sb-guide-pass";
  var data = JSON.parse(document.getElementById("payload").textContent);
  var gate = document.getElementById("gate");
  var doc = document.getElementById("doc");
  var form = document.getElementById("form");
  var input = document.getElementById("pass");
  var go = document.getElementById("go");
  var msg = document.getElementById("msg");

  function b2a(b64) {
    var s = atob(b64), n = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) n[i] = s.charCodeAt(i);
    return n;
  }

  function say(text, isError) {
    msg.textContent = text;
    msg.classList.toggle("is-error", !!isError);
  }

  async function unlock(raw) {
    var pass = String(raw || "").trim().toUpperCase();
    if (!pass) { say("Enter the passcode to continue.", true); return false; }
    var subtle = window.crypto && window.crypto.subtle;
    if (!subtle) {
      say("This browser can't unlock the page. Try Safari, Chrome, or Firefox.", true);
      return false;
    }
    var material = await subtle.importKey(
      "raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]
    );
    var key = await subtle.deriveKey(
      { name: "PBKDF2", salt: b2a(data.salt), iterations: data.iter, hash: "SHA-256" },
      material, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
    );
    var plain;
    try {
      plain = await subtle.decrypt({ name: "AES-GCM", iv: b2a(data.iv) }, key, b2a(data.ct));
    } catch (e) {
      return false;
    }
    doc.innerHTML = new TextDecoder().decode(plain);
    gate.hidden = true;
    doc.hidden = false;
    document.title = "Building a Claude Second Brain";
    try { localStorage.setItem(KEY, pass); } catch (e) {}
    return true;
  }

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    go.disabled = true;
    say("Unlocking…", false);
    var ok = await unlock(input.value);
    if (!ok) {
      go.disabled = false;
      say("That passcode doesn't match. Check for typos — case and spacing don't matter.", true);
      input.select();
    }
  });

  input.addEventListener("input", function () {
    if (msg.classList.contains("is-error")) say("", false);
  });

  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) {
    unlock(saved).then(function (ok) {
      if (!ok) { try { localStorage.removeItem(KEY); } catch (e) {} }
    });
  } else {
    input.focus();
  }
})();
</script>
